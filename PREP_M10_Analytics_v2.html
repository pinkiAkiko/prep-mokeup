<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PREP Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--navy:#1A2332;--blue:#2E6EBF;--blue-d:#1E4A8A;--green:#1E7B4B;--orange:#C2611C;--red:#C0392B;
--sub:#5F6B7A;--muted:#64707E;--b1:#E0E4E8;--b2:#F2F4F6;--b3:#FAFBFC;--bg:#EAECF0;--line:#C7CED6;--hd:#F5F6F8;--sel:#EEF3FA}
*{box-sizing:border-box}
/* thin, light scrollbars everywhere (the dark sidebar overrides with its own) */
*{scrollbar-width:thin;scrollbar-color:#CBD2DA transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D3D9E0;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#AAB4C0}
::-webkit-scrollbar-button{display:none;width:0;height:0}
body{margin:0;background:var(--bg);color:var(--navy);font:13px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.num,td.n,.kv{font-variant-numeric:tabular-nums}
a{color:var(--blue-d)}

    .header {
      background: #1E2A3A;
      height: 54px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      border-bottom: 1px solid #263040;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .hamburger {
      width: 34px;
      height: 34px;
      border-radius: 5px;
      background: #263040;
      border: 1px solid #2E3F54;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      color: #73808F;
      font-size: 16px;
      user-select: none;
    }

    .hamburger:hover {
      background: #2E3F54;
      color: #CBD5E0;
    }

    .header-logo {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-title {
      color: #E2E8F0;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-subtitle {
      color: #8b98a5;
      font-size: 10px;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .header-icon-btn {
      position: relative;
      cursor: pointer;
      color: #6A7A8A;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .notif-badge {
      position: absolute;
      top: -5px;
      right: -7px;
      background: #C0392B;
      color: #fff;
      border-radius: 50%;
      width: 15px;
      height: 15px;
      font-size: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #263040;
    }

    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #263040;
      border: 1.5px solid #3A4F66;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7A9AB8;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-name {
      color: #CBD5E0;
      font-size: 12px;
      font-weight: 500;
    }

    .user-role-label {
      color: #8b98a5;
      font-size: 10px;
    }

    .user-menu-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 240px;
      background: #1E2A3A;
      border: 1px solid #2E3F54;
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      padding: 6px;
      display: none;
      z-index: 300;
    }

    .user-menu-dropdown.open {
      display: block;
    }

    .user-menu-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #6A7A8A;
      padding: 8px 10px 6px;
    }

    .user-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .user-menu-item:hover {
      background: #263040;
    }

    .user-menu-item.active {
      background: #23324A;
      cursor: default;
    }

    .user-menu-item .uma {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #263040;
      border: 1.5px solid #3A4F66;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7A9AB8;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-menu-item .umt {
      display: block;
      font-size: 12px;
      color: #CBD5E0;
      font-weight: 500;
    }

    .user-menu-item .ums {
      display: block;
      font-size: 10px;
      color: #8b98a5;
    }

    .user-menu-divider {
      height: 1px;
      background: #2E3F54;
      margin: 6px 4px;
    }

    .user-menu-item.logout .umt {
      color: #C0392B;
    }


/* shell: header and sidebar follow Analytics 3 / the PREP portal pattern */
.header *,.sidebar *{margin:0}
.app-shell{display:flex;align-items:flex-start;margin-top:54px}
.hamburger{padding:0;font-family:inherit}
.hamburger:focus-visible,.header-icon-btn:focus-visible,.header-user:focus-visible,.nav-item:focus-visible,.user-menu-item:focus-visible{outline:2px solid #5A8AB8;outline-offset:-2px}
.header-icon-btn,.header-user{background:none;font:inherit;text-align:left}
.header-icon-btn{border:0;padding:0}
.header-user{color:inherit}
.user-menu-wrap{position:relative}
.sidebar .nav-item{width:100%;border:0;background:none;text-align:left;font-family:inherit}
    /* Sidebar */
    .sidebar {
      width: 215px;
      flex-shrink: 0;
      background: #1A2438;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #222F40;
      overflow: hidden;
      transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.collapsed {
      width: 52px;
    }

    .sidebar-entity {
      padding: 14px 15px 12px;
      border-bottom: 1px solid #222F40;
      overflow: hidden;
      white-space: nowrap;
    }

    .sidebar.collapsed .sidebar-entity {
      padding: 10px 0;
      display: flex;
      justify-content: center;
    }

    .sidebar-entity-name {
      color: #BCC8D8;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
    }

    .sidebar-entity-sub {
      color: #9aadc1;
      font-size: 10px;
      margin-top: 3px;
    }

    .sidebar-zone-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #222F40;
      border-radius: 3px;
      padding: 3px 7px;
      margin-top: 7px;
      color: #5A8AB8;
      font-size: 10px;
      font-weight: 600;
    }

    .zone-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #C2611C;
      display: inline-block;
    }

    .scope-filter {
      margin-top: 10px;
    }

    .scope-filter-label {
      display: block;
      color: #6E7F94;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .scope-select {
      width: 100%;
      background: #222F40;
      color: #BCC8D8;
      border: 1px solid #2E3F54;
      border-radius: 4px;
      padding: 5px 7px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
    }

    .scope-select:focus {
      outline: none;
      border-color: #2E6EBF;
    }

    .sidebar.collapsed .scope-filter {
      display: none;
    }

    .sidebar-collapsed-avatar {
      display: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #222F40;
      border: 1px solid #2E3F54;
      align-items: center;
      justify-content: center;
      color: #5A8AB8;
      font-size: 10px;
      font-weight: 700;
    }

    .sidebar.collapsed .sidebar-entity-name,
    .sidebar.collapsed .sidebar-entity-sub,
    .sidebar.collapsed .sidebar-zone-chip {
      display: none;
    }

    .sidebar.collapsed .sidebar-collapsed-avatar {
      display: flex;
    }

    .nav-group-label {
      padding: 12px 15px 3px;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #354555;
      font-weight: 600;
      white-space: nowrap;
    }

    .sidebar.collapsed .nav-group-label {
      display: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 15px;
      cursor: pointer;
      font-size: 12px;
      color: #d0d7de;
      transition: background 0.12s, color 0.12s;
      user-select: none;
      position: relative;
      white-space: nowrap;
    }

    .nav-item:hover {
      background: #1F2E40;
      color: #BCC8D8;
    }

    .nav-item.active {
      background: #1F2E40;
      color: #FFFFFF;
      border-left: 3px solid #C2611C;
      padding-left: 12px;
    }

    .sidebar.collapsed .nav-item {
      justify-content: center;
      padding: 10px 0;
    }

    .sidebar.collapsed .nav-item.active {
      border-left: 3px solid #C2611C;
      padding-left: 0;
    }

    .nav-arrow {
      font-size: 9px;
      color: #9aadc1;
      flex-shrink: 0;
      margin-left: auto;
      transition: transform 0.18s;
    }

    .nav-arrow.open {
      transform: rotate(180deg);
    }

    .sidebar.collapsed .nav-arrow {
      display: none;
    }

    .nav-sub-group {
      overflow: hidden;
    }

    .nav-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 15px 6px 42px;
      font-size: 11px;
      color: #d0d7de;
      cursor: pointer;
    }

    .nav-sub:hover {
      color: #BCC8D8;
      background: #1F2E40;
    }

    .nav-sub.active {
      color: #FFFFFF;
    }

    .nav-sub-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #3A4E66;
      flex-shrink: 0;
    }

    .nav-sub.active .nav-sub-dot {
      background: #C2611C;
    }

    .sidebar.collapsed .nav-sub-group {
      display: none;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
    }

    .nav-item.active .nav-icon {
      opacity: 1;
    }

    .nav-label {
      flex: 1;
    }

    .sidebar.collapsed .nav-label {
      display: none;
    }

    .nav-badge {
      background: #C0392B;
      color: #fff;
      border-radius: 9px;
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .sidebar.collapsed .nav-badge {
      display: none;
    }

    .nav-tooltip {
      display: none;
      position: absolute;
      left: 58px;
      top: 50%;
      transform: translateY(-50%);
      background: #1A2438;
      border: 1px solid #2E3F54;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 11px;
      color: #CBD5E0;
      white-space: nowrap;
      z-index: 9998;
      pointer-events: none;
    }

    .sidebar.collapsed .nav-item:hover .nav-tooltip {
      display: block;
    }

    /* Main — fixed height, internal panes scroll, not the page */


/* M10 sub-menu under the parent item */
.nav-parent{cursor:default;color:#fff;font-weight:600}
.nav-parent:hover{background:none;color:#fff}
.sidebar .nav-sub{position:relative;width:100%;border:0;background:none;text-align:left;font-family:inherit;padding:8px 15px 8px 30px;font-size:12px;min-height:36px;white-space:nowrap}
.sidebar .nav-sub.active{background:#1F2E40;border-left:3px solid #C2611C;padding-left:27px;color:#fff}
.nav-sub:focus-visible{outline:2px solid #5A8AB8;outline-offset:-2px}
.nav-sub .nav-icon{width:16px;height:16px}
.nav-sub .nav-icon svg{width:16px;height:16px}
.sidebar.collapsed .nav-sub-group{display:block}
.sidebar.collapsed .nav-parent{display:none}
.sidebar.collapsed .nav-sub{justify-content:center;padding:10px 0}
.sidebar.collapsed .nav-sub.active{padding-left:0}
.sidebar.collapsed .nav-sub:hover .nav-tooltip{display:block}
.nav-disp{opacity:.9}
@media(max-width:767px){.sidebar .nav-sub{min-height:44px}}
.sidebar{position:sticky;top:54px;height:calc(100vh - 54px)}
.sidebar-entity-name,.sidebar-entity-sub{overflow:hidden;text-overflow:ellipsis}
.scope-filter{display:flex;flex-direction:column;gap:6px}
.scope-filter[hidden],.scope-select[hidden]{display:none}
.scope-filter .scope-select{min-height:30px}
.sidebar-collapsed-avatar{margin:0}
#side{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:12px}
@media(max-width:767px){
  .header-subtitle,.header-icon-btn .lbl,.user-name,.user-role-label{display:none}
  .header-right{gap:10px}
  .header-user{padding:4px}
  .hamburger{width:44px;height:44px}
  .nav-item{min-height:44px}
  .scope-filter .scope-select{font-size:16px;min-height:44px}
  .user-menu-item{min-height:44px}
}
main{padding:16px;min-width:0;flex:1;display:flex;flex-direction:column}
.app-shell{min-height:calc(100vh - 54px);align-items:stretch}
.app-shell>.sidebar{align-self:flex-start}
main>.foot{margin-top:auto}
#catgrid,#savedgrid{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#catgrid>.cat,#catgrid>.sec{flex:none}
.cgf{flex:1 1 auto;display:flex;flex-direction:column;min-height:300px}
.cgs{flex:1 1 auto;overflow:auto;min-height:0}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 18px;padding:8px 12px;border-top:1px solid var(--b1);background:#fff}
.pager label{display:flex;align-items:center;gap:6px;margin:0}
.pager select{width:auto;min-width:64px;min-height:30px;padding:0 6px}
.pgb{display:flex;align-items:center;gap:8px}
.pgb .btn{min-height:30px;min-width:32px;padding:0 10px}
.pgb .btn[disabled]{opacity:.4;cursor:default}
.ph1{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.ph1 h1{font-size:19px;font-weight:600;margin:0}
.meta{font-size:12px;color:var(--sub);margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--b3)}
.btn.pri{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.btn.pri:hover{background:#173B70}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.link{border-color:transparent;background:none;color:var(--blue-d);padding:0 6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
@media(max-width:767px){.btn{min-height:44px}}

/* panels */
.g{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:12px}
@media(min-width:1280px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g73{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}.g57{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
.panel{background:#fff;border:1px solid var(--b1);border-radius:4px;min-width:0}
.phd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--b2)}
.phd h2{font-size:14px;font-weight:600;margin:0}
.phd .q{font-size:11.5px;color:var(--muted)}
.pb{padding:12px 14px}
.lede{font-size:13.5px;line-height:1.55;max-width:120ch;margin:0}
.lede b{font-weight:600}
.note{font-size:11.5px;color:var(--muted)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
@media(min-width:768px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1280px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cgrid{border-collapse:collapse;width:100%;background:#fff}
.cgrid tr.fill td{height:100%;padding:0;border-top:0}
.cgrid tr.fill:hover td{background:transparent}
.cgrid th,.cgrid td{border:1px solid var(--b1);padding:6px 12px;height:38px;vertical-align:middle}
.cgrid thead th{background:var(--hd,#F4F6F8);font-weight:600;white-space:nowrap}
.cgrid tbody tr:hover td{background:#F7FAFE}
.cgrid td .btn{min-height:28px;padding:0 12px}
.cgrid .av{margin-top:2px}
.cgf{border:1px solid var(--b1);border-radius:4px;background:#fff}
.foot{margin:18px 0 6px;padding:12px 2px 0;border-top:1px solid var(--b1);font-size:12px;color:var(--sub)}
/* anything the page scrolls to stops below the fixed header, never under it */
html{scroll-padding-top:76px}
.sev{display:inline-block;width:9px;height:9px;margin-right:10px;border-radius:50%;vertical-align:1px;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sevkey{display:flex;gap:14px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--b2);font-size:11.5px;color:var(--sub)}
.sevkey .sev{margin-right:5px}
.sevdots{display:flex;gap:4px;align-items:center}
.sd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:10.5px;font-weight:700}
.sd.s3{background:#C0392B;color:#fff}
.sd.s2{background:#E0A526;color:#fff}
.sd.s1{background:#9AA6B5;color:#fff}
.sev.s3{background:#C0392B}
.sev.s2{background:#E0A526}
.sev.s1{background:#9AA6B5}
.hi{color:#A8281D;font-size:11.5px;font-weight:600}
.cnt{display:inline-block;margin-left:8px;min-width:20px;padding:0 8px;border-radius:10px;background:#EAECF0;color:var(--navy);font-size:11.5px;font-weight:600;line-height:20px;text-align:center;vertical-align:1px}
.cnt.r{background:#FADCD8;color:#A8281D}
.fm-2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fm .pills{margin:2px 0 0}
.mmenu .mchk{min-height:26px}
.mmenu .btn.link{min-height:26px;padding:0 4px}
.cardsel .mmenu.two{min-width:min(600px,calc(100vw - 40px))}
.sl{display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.mmenu.fm{min-width:340px;max-width:calc(100vw - 32px);padding:12px 14px;max-height:min(480px,calc(100vh - 100px))}
.msub .mmenu.up{top:auto;bottom:38px}
.cardsel .mmenu.rt,.msub .mmenu.rt{left:auto;right:0}
.fm-list{max-height:120px}
@media(max-width:640px){.mmenu.fm{min-width:0;max-width:none;max-height:min(70vh,520px)}}
.fm-f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fm-f select{width:100%}
.fm-list{display:grid;gap:2px;max-height:150px;overflow:auto}
.td{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 8px 0 2px;flex:none}
.td.t1{background:#E9A39B}.td.t2{background:#F0BD8D}.td.t3{background:#B7C0CC}
.mchk:has(.td){display:flex;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}
.pill{position:relative;cursor:pointer}
.pill input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.pill span{display:inline-block;padding:4px 10px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--navy);font-size:12px;font-weight:600;line-height:20px;text-align:center}
.pill:has(input:checked) span{background:#2E6EBF;border-color:#2E6EBF;color:#fff}

function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mb(20261124),R2=mb(777);
const pick=(arr,wf,rf=R)=>{let s=0;arr.forEach(x=>s+=wf(x));let r=rf()*s;for(const x of arr){r-=wf(x);if(r<=0)return x}return arr[arr.length-1]};
const gauss=()=>{const u=R()||1e-9,v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const logn=(m,s)=>m*Math.exp(s*gauss());
const N1=['Shree Ganesh','Sai Krishna','Om Sai','Apex','Suryoday','Vardhan','Mahalaxmi','Bharat','Rudra','Kaveri','Narmada','Sahyadri','Trimurti','Pragati','Unnati','Anand','Swastik','Nilkanth','Shubham','Gomti','Vindhya','Kesar','Tapti','Indus','Sindhu','Akshar','Jyoti','Prabhat'];
const N2=['Fine Chem','Organics','Pharma','Laboratories','Lifesciences','Intermediates','Chemicals','Speciality Chem'];
const N3=['Pvt Ltd','Ltd','LLP','Pvt Ltd','Pvt Ltd'];
let P=[];
for(let i=0;i<1079;i++){
  const Z=pick(ZONES,x=>x.w), z=Z.z, b=ZB[z];
  const n=R()<.58?1:R()<.72?2:R()<.78?3:4;
  const subs=[pick(SUBS,x=>x.w*(x.aff[z]||1)).id];
  while(subs.length<n){const last=subs[subs.length-1];const rel=RELATED.find(p=>p.includes(last)&&!subs.includes(p[0]===last?p[1]:p[0]));
    subs.push(rel&&R()<.6?(rel[0]===last?rel[1]:rel[0]):pick(SUBS.filter(x=>!subs.includes(x.id)),x=>x.w*(x.aff[z]||1)).id)}
  const reg=R()<.105*b.g*(subs.some(id=>tierOf(id)===1)?2.4:1)?2026:2019+Math.floor(R()*7);
  const chronic=R()<.045, low=R()<.012*b.an, high=!low&&R()<.005, unmP=R()<.035*b.u, unmPrev=R()<.03*b.u;
  const hs=subs.map(id=>{const S=SM[id],step=S.cap>5000?100:5;const cap=Math.max(step,Math.round(logn(S.cap,.75)/step)*step);
    const u=low?.04+R()*.08:high?1.12+R()*.3:.42+R()*.45, use=cap*u, g=.06*b.g+.12*gauss(), useP=reg===2026?0:use/Math.max(.5,1+g);
    const imp=R()<S.imp?use*(.3+R()*.6):0, exp=R()<S.exp?use*(.2+R()*.5):0, ig=.05+.18*gauss(), sent=R()<S.sale?use*(.3+R()*.5):0;
    return {id,cap,use,useP,imp,exp,impP:reg===2026?0:imp/Math.max(.4,1+ig),expP:reg===2026?0:exp/Math.max(.4,1+.04+.15*gauss()),
      sent,sentP:reg===2026?0:sent/(1+g),unm:unmP&&sent?sent*(.03+R()*.12):0,unmPv:unmPrev&&sent?sent*(.03+R()*.1):0,cases:[]}});
  const fr=Math.max(.3,b.f-(chronic?.4:0)), frp=Math.max(.3,b.fp-(chronic?.4:0));
  P.push({i,z,r:Z.r,urn:`URN/${ZC[z]}/${reg}/${String(1000+i*7%9000).padStart(4,'0')}`,
    name:`${N1[Math.floor(R()*N1.length)]} ${N2[Math.floor(R()*N2.length)]} ${N3[Math.floor(R()*N3.length)]}`,reg,subs,hs,
    filed:[0,1,2,3].map(q=>reg===2026&&q<2?null:R()<fr),filedP:[0,1,2,3].map(()=>reg>=2025?null:R()<frp),low,high,chronic});
}
const CAN=[];
ZONES.forEach(Z=>{const base=P.filter(p=>p.z===Z.z).length;[2022,2023,2024,2025,2026].forEach(y=>{const k=Math.round(base*(.018+R()*.03)*(Z.z==='Patna'&&y===2026?2.2:1));
  for(let j=0;j<k;j++){const n=R()<.6?1:2,s=[];while(s.length<n){const t=pick(SUBS,x=>x.w*(x.aff[Z.z]||1)).id;if(!s.includes(t))s.push(t)}CAN.push({z:Z.z,r:Z.r,y,subs:s,cx:1})}})});

  p.hs.forEach(h=>{const S=SM[h.id];
    if(h.unm>0){const k=1+Math.floor(R2()*3);for(let j=0;j<k;j++){const buyers=P.filter(q=>q!==p&&q.subs.includes(h.id));const bq=buyers[Math.floor(R2()*buyers.length)]||p;
      NOTES.push({p,h,S,no:`CN/${ZC[p.z]}/26/${String(Math.floor(R2()*90000)+10000)}`,qty:h.unm/k,buyer:bq,days:15+Math.floor(R2()*100)})}}

});
ZONES.forEach(Z=>{const n=P.filter(p=>p.z===Z.z).length,k=Math.max(1,Math.round(n*.075));

const dueOf=q=>{const m=[2,5,8,11][qNum(q)-1];return new Date(qYear(q),m+1,15)};
const R3=mb(4242);
const R4=mb(5151),g4=()=>{const u=R4()||1e-9,v=R4();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)},MSH={AA:.18,PSE:.14,ANT:.3,EPH:.14,NAA:.3,BMP:.1,NPP:.08,ANPP:.08}; /* share of holders that also manufacture */
const g3=()=>{const u=R3()||1e-9,v=R3();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const SEAS=[1.04,.97,1.0,.99];
PALL.forEach(p=>{
  p.regQ=p.reg<2023?-99:p.reg===2026?11+Math.floor(R3()*3):Math.max(0,qIndex(p.reg,1+Math.floor(R3()*4)));
  const b=ZB[p.z];
  p.fq=[...Array(NQ)].map((_,q)=>q<p.regQ?null:R3()<Math.max(.3,(q>=10?b.f:q>=6?b.fp:b.fp-.02)-(p.chronic?.4:0)));
  p.lowM=R4()<.014*b.an;
  p.hs.forEach(h=>{const gr=Math.min(1.12,Math.max(.9,h.useP?Math.pow(h.use/h.useP,.25):1.02));
    const mk=(tot,noise)=>[...Array(NQ)].map((_,q)=>q<p.regQ||!tot?0:tot/4*Math.pow(gr,q-11.5)*SEAS[qNum(q)-1]*Math.max(.3,1+noise*g3()));
    h.q={use:mk(h.use,.08),imp:mk(h.imp,.25),exp:mk(h.exp,.25),sent:mk(h.sent,.15),unm:[...Array(NQ)].map(()=>0)};
    h.capM=0;h.mfgT=0;if(R4()<(MSH[h.id]||.15)){h.capM=Math.max(5,Math.round(h.cap*(1.5+R4()*1.5)/5)*5);h.mfgT=h.capM*(p.lowM?.05+R4()*.07:.45+R4()*.42)}h.q.mfg=[...Array(NQ)].map((_,q)=>q<p.regQ||!h.mfgT?0:h.mfgT/4*Math.pow(gr,q-11.5)*SEAS[qNum(q)-1]*Math.max(.3,1+.08*g4()));
    if(h.unm>0){const a=10+Math.floor(R3()*4),c=10+Math.floor(R3()*4);h.q.unm[a]+=h.unm*.6;h.q.unm[c]+=h.unm*.4;h.q.sent[a]=Math.max(h.q.sent[a],h.q.unm[a]*3);h.q.sent[c]=Math.max(h.q.sent[c],h.q.unm[c]*3)}
    if(h.unmPv>0){const a=6+Math.floor(R3()*4);h.q.unm[a]+=h.unmPv;h.q.sent[a]=Math.max(h.q.sent[a],h.unmPv*3)}
    for(let q=Math.max(0,p.regQ);q<6;q++)if(h.q.sent[q]&&R3()<.02*ZB[p.z].u)h.q.unm[q]+=h.q.sent[q]*(.03+R3()*.1);
    h.cases.forEach(c=>c.q=c.y===2026?10+Math.floor(R3()*4):6+Math.floor(R3()*4))});
  p.isMfr=p.hs.some(h=>h.capM>0);p.lowM=p.lowM&&p.isMfr;
});
CAN.forEach(c=>{c.q=c.y<2023?-99:Math.min(LASTQ,Math.max(0,qIndex(c.y,1+Math.floor(R3()*4))));if(c.y===2026)c.q=Math.max(10,c.q)});

/* ===================== the period: one control for every dashboard and report ===================== */
const PER={view:'q',q:LASTQ,fy:fyStart(LASTQ),from:LASTQ-7,to:LASTQ,cmp:'yoy'};
let CUR=[],CMP=[],SHIFT=4,CMPOK=true;
function periodSets(){let c;
  if(PER.view==='q')c=[PER.q];
  else if(PER.view==='fy'){const s=qIndex(PER.fy,2);c=[s,s+1,s+2,s+3].filter(q=>q>=0&&q<=LASTQ)}
  else if(PER.view==='l4')c=[LASTQ-3,LASTQ-2,LASTQ-1,LASTQ];
  else{const a=Math.min(PER.from,PER.to),b=Math.max(PER.from,PER.to);c=[];for(let q=a;q<=b;q++)c.push(q)}
  const sh=PER.cmp==='prev'?(PER.view==='fy'?4:c.length):4,m=c.map(q=>q-sh);
  return {cur:c,cmp:m,shift:sh,ok:PER.cmp!=='none'&&m.every(q=>q>=0)}}
function perLabel(set){if(!set||!set.length)return '';if(set.length===1)return QLAB(set[0]);
  if(PER.view==='fy')return FYLAB(fyStart(set[0]))+(set.length<4?` (${QLAB(set[0])} to ${QLAB(set[set.length-1])})`:'');
  return `${QLAB(set[0])} to ${QLAB(set[set.length-1])}`}
const QE=()=>QLAB(CUR[CUR.length-1]);
const vs=()=>CMPOK?`vs ${perLabel(CMP)}`:'';

  const E=CUR[CUR.length-1],EP=CMP.length?CMP[CMP.length-1]:-1,len=CUR.length,S=(a,set)=>set.reduce((t,q)=>t+(a[q]||0),0);

    p.fCur=CUR.map(q=>p.fq[q]);p.fCmp=CMP.map(q=>p.fq[q]);p.isNew=CUR.includes(p.regQ);p.prevOk=EP>=0&&p.regQ<=EP;
    p.hs.forEach(h=>{h.use=S(h.q.use,CUR);h.useP=S(h.q.use,CMP);h.imp=S(h.q.imp,CUR);h.impP=S(h.q.imp,CMP);h.exp=S(h.q.exp,CUR);h.expP=S(h.q.exp,CMP);
      h.sent=S(h.q.sent,CUR);h.sentP=S(h.q.sent,CMP);h.unm=S(h.q.unm,CUR);h.unmPv=S(h.q.unm,CMP);h.capPer=h.cap*len/4;h.mfg=S(h.q.mfg,CUR);h.mfgP=S(h.q.mfg,CMP);h.capMPer=h.capM*len/4})});
  P=PALL.filter(p=>p.regQ<=E);
  CAN.forEach(c=>{c.inCur=CUR.includes(c.q);c.inCmp=CMP.includes(c.q);c.liveAtCmpEnd=EP>=0&&c.q>EP&&c.q<=E});
  recompute()}

/* one quarter for any area: feeds the trend strips and the quarter-by-quarter tables */
function qstat(ps,q){let e=0,f=0,t1=0,t2=0,t3=0,n=0,uw=0,uu=0,cw=0,cu=0,mw=0,mu=0;const bs={};
  ps.forEach(p=>{if(p.regQ>q)return;n++;if(p.subs.some(id=>tierOf(id)===1))t1++;if(p.subs.some(id=>tierOf(id)===2))t2++;if(p.subs.some(id=>tierOf(id)===3))t3++;const x=p.fq[q];if(x!==null&&x!==undefined){e++;if(x)f++}
    p.hs.forEach(h=>{const b=bs[h.id]||(bs[h.id]={s:0,u:0,use:0,cap:0,mfg:0,capM:0});b.s+=h.q.sent[q];b.u+=h.q.unm[q];b.use+=h.q.use[q];b.cap+=h.cap;b.mfg+=h.q.mfg[q];b.capM+=h.capM})});
  SUBS.forEach(S=>{const b=bs[S.id];if(!b)return;if(b.s>0){uw+=S.w;uu+=S.w*b.u/b.s}if(b.cap>0){cw+=S.w;cu+=S.w*b.use*4/b.cap}if(b.capM>0){mw+=S.w;mu+=S.w*b.mfg*4/b.capM}});
  return {n,t1,t2,t3,filed:e?f/e*100:null,unm:uw?uu/uw*100:0,util:cw?cu/cw*100:0,utilM:mw?mu/mw*100:0,adds:ps.filter(p=>p.regQ===q).length}}
let NAT={},ZS={},RS={},IN={};
function area(ps,cans){const E=CUR[CUR.length-1];
  const q=qrate(ps,3),qp=qrate(ps,3,true);let sh=0,sw=0,un=0,se=0,unP=0,seP=0;

function subRows(ps){return SUBS.map(S=>{const hp=ps.filter(p=>holds(p,S.id)),hs=hp.map(p=>H(p,S.id));

/* in the All view, the tab of the section on screen lights up as you scroll */
function catSpy(){const bar=document.querySelector('.cattabs');if(!bar||ST.rg||ST.cview.reports!=='cards')return;const lim=bar.getBoundingClientRect().bottom+24;let cur='';document.querySelectorAll('#catgrid .sec').forEach(e=>{if(e.getBoundingClientRect().top<=lim)cur=e.firstChild.textContent.trim()});bar.querySelectorAll('button').forEach(b=>{const on=b.dataset.rg===cur;if(b.classList.contains('on')!==on){b.classList.toggle('on',on);b.setAttribute('aria-selected',on);if(on&&bar.scrollWidth>bar.clientWidth)bar.scrollLeft=Math.max(0,b.offsetLeft-24)}})}
window.addEventListener('scroll',catSpy,{passive:true});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.rq)return;ST.rq=t.value;ST.pg.reports.p=1;const g=document.getElementById('catgrid');if(g){g.innerHTML=catGrid();fitFill()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-rg]');if(!b)return;ST.rg=b.dataset.rg;ST.pg.reports.p=1;document.querySelectorAll('.cattabs button').forEach(c=>{const on=c.dataset.rg===ST.rg;c.classList.toggle('on',on);c.setAttribute('aria-selected',on)});const g=document.getElementById('catgrid');if(g){{g.innerHTML=catGrid();fitFill()};const bar=document.querySelector('.cattabs'),y=g.getBoundingClientRect().top+window.scrollY-(bar?bar.offsetHeight:0)-54-10;if(window.scrollY>y)window.scrollTo(0,Math.max(0,y))}});
ST.sq='';
function savedGrid(){const q=ST.sq.trim().toLowerCase(),rows=SAVED.map((v,i)=>({v,i})).filter(({v})=>!q||(v.n+' '+(RM[v.rep]?RM[v.rep].title:'')).toLowerCase().includes(q));
  if(ST.cview.saved==='table'&&rows.length){const P1=ST.pg.saved,pp=Math.min(P1.p,Math.max(1,Math.ceil(rows.length/P1.n))),pr=rows.slice((pp-1)*P1.n,pp*P1.n);return '<div class="frame cgf"><div class="cgs"><table class="t cgrid"><thead><tr><th>Name</th><th>Report</th><th>Shows</th><th>Saved on</th><th></th></tr></thead><tbody>'+pr.map(({v,i})=>'<tr><td><b>'+esc(v.n)+'</b></td><td>'+esc(RM[v.rep]?RM[v.rep].title:v.rep)+'</td><td class="sm">'+(RM[v.rep]?catDesc([0,0,0,0,0,RM[v.rep].def]).replace('<br>',' · '):'')+'</td><td>'+esc(v.on)+'</td><td class="n"><button class="btn" data-oview="'+i+'">Open</button></td></tr>').join('')+'<tr class="fill"><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>'+pageBar('saved',rows.length)+'</div>'}
  return rows.length?'<div class="cat">'+rows.map(({v,i})=>'<button class="ci" data-oview="'+i+'"><b>'+esc(v.n)+'</b><span class="cd">'+esc(RM[v.rep]?RM[v.rep].title:v.rep)+'<br>Saved on '+esc(v.on)+'</span><span class="cf"><span class="go">Open ›</span></span></button>').join('')+'</div>':'<div class="pb sm">'+(SAVED.length?'No saved view matches.':'Nothing saved yet. Open a report, set it up, and choose Save view.')+'</div>'}
function savedView(){return pageHead('Saved views','Your own report layouts, kept with their rows, values and filters.','<input type="search" class="msearch catsearch" placeholder="Search saved views" value="'+esc(ST.sq)+'" data-sq="1" aria-label="Search saved views">'+viewSwitch('saved'))+'<div id="savedgrid">'+savedGrid()+'</div>'+footer()}
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.sq)return;ST.sq=t.value;ST.pg.saved.p=1;const g=document.getElementById('savedgrid');if(g){g.innerHTML=savedGrid();fitFill()}});

/* ===================== Super Admin configuration ===================== */
function cfgView(){const tabs=[['th','Thresholds'],['tier','Risk tiers'],['watch','Watch rules'],['score','Risk score'],['perf','Data refresh and performance'],['log','Change log']];
  let b='';
  if(ST.cfgTab==='th')b=`<div class="pb note">Each threshold is a <code>system_config</code> row. A substance takes the value of its tier, so one change applies to every substance in that tier. Changes apply from the next nightly refresh.</div>`+
    `<div class="frame"><table class="t"><thead><tr><th>Metric</th><th>Judged at</th><th class="n">Tier 1</th><th class="n">Tier 2</th><th class="n">Tier 3</th><th>Unit</th></tr></thead><tbody>${Object.entries(CFG.th).map(([k,t])=>`<tr><td><b>${t.h}</b><div class="sm">${t.note||(t.better==='up'?'Breached when the figure falls below':'Breached when the figure rises above')}</div></td><td>${t.scope}</td>${t.t.map((v,i)=>`<td class="n"><input class="cfgin" type="number" step="0.1" value="${v}" data-th="${k}:${i}" aria-label="${t.h}, tier ${i+1}"></td>`).join('')}<td>${t.u}</td></tr>`).join('')}</tbody></table></div><div class="pb"><button class="btn pri" data-cfgsave="1">Save thresholds</button></div>`;
  if(ST.cfgTab==='tier')b=`<div class="pb note">The tier decides which thresholds apply and how the dashboards group substances. Proposed by the portal; to be confirmed by NCB.</div>`+table('tierT',[{k:'name',h:'Substance',f:s=>`<b>${s.sh}</b><div class="sm">HSN ${s.hsn}</div>`,v:s=>s.sh},{k:'th',h:'Illicit use',f:s=>THREAT[s.th]},
    {k:'t',h:'Tier',v:s=>tierOf(s.id),f:s=>`<select class="fi" style="max-width:240px" data-tier="${s.id}">${[1,2,3].map(t=>`<option value="${t}" ${tierOf(s.id)===t?'selected':''}>${TIERN[t]}</option>`).join('')}</select>`}],SUBS,{})+`<div class="pb"><button class="btn pri" data-cfgsave="1">Save tiers</button></div>`;
  if(ST.cfgTab==='watch')b=`<div class="pb"><div class="g g2" style="margin:0"><div><div class="fl" style="font-weight:600">Comes back early if it worsens by</div>${Object.entries(CFG.worse).map(([k,v])=>`<label class="fg" style="display:flex;justify-content:space-between;align-items:center;border:0;padding:4px 0">${({file:'Returns filed (points)',unm:'Unmatched (points)',anom:'Companies far under capacity',growth:'Tier 1 growth (points)',imp:'Import gap (points)'})[k]}<input class="cfgin" type="number" step="0.1" value="${v}" data-worse="${k}"></label>`).join('')}</div>
     <div><div class="fl" style="font-weight:600">Review periods offered to HQ</div><div class="sm" style="margin-bottom:6px">${CFG.review.join(', ')} days, or when the next quarter's returns close. Default ${CFG.defaultReview} days.</div><div class="note">The DG's discussion record is kept per matter, with an <code>audit_log</code> row for each change. It is never sent to a region or zone.</div></div></div><button class="btn pri" data-cfgsave="1" style="margin-top:10px">Save watch rules</button></div>`;
  if(ST.cfgTab==='score')b=`<div class="pb note">Each flag adds its points to a company's risk score, up to the cap. Switch a flag off to leave it out. The score only orders the Top 10 list. Changes apply from the next nightly refresh.</div><div class="frame"><table class="t"><thead><tr><th>Flag</th><th class="n">Points</th><th>Active</th></tr></thead><tbody>${CFG.score.map(x=>`<tr><td><b>${x.h}</b></td><td class="n"><input class="cfgin" type="number" min="0" max="100" value="${x.pts}" data-sc="${x.id}:pts" aria-label="Points for ${x.h}"></td><td><label class="mchk"><input type="checkbox" data-sc="${x.id}:on" ${x.on?'checked':''}> ${x.on?'On':'Off'}</label></td></tr>`).join('')}<tr><td><b>Highest score possible</b></td><td class="n"><input class="cfgin" type="number" min="1" max="1000" value="${CFG.scoreCap}" data-sccap="1" aria-label="Highest score"></td><td></td></tr></tbody></table></div><div class="pb"><button class="btn pri" data-cfgsave="1">Save</button></div>`;
  if(ST.cfgTab==='perf')b=`<div class="pb"><div class="g g2" style="margin:0">
     <div><div class="fl" style="font-weight:600">Nightly summary refresh</div><input class="fi" style="max-width:120px" type="time" value="${CFG.refresh}"><div class="note">Dashboards read summary tables, never the live returns. Also refreshed one hour after each return due date.</div></div>
     <div><div class="fl" style="font-weight:600">Rows per page in lists and drill-downs</div><input class="cfgin" type="number" value="${CFG.pageSize}"><div class="note">Companies rows load a page at a time.</div></div>
     <div><div class="fl" style="font-weight:600">Warn HQ when matters exceed</div><input class="cfgin" type="number" value="${CFG.matterWarn}" data-warn="1"><div class="note">Today: ${MATTERS.length}. A long list usually means the thresholds are too tight.</div></div>
     <div><div class="fl" style="font-weight:600">Largest export prepared at once</div><input class="cfgin" style="width:110px" type="number" value="${CFG.exportCap}"><div class="note">Bigger exports are built in the background.</div></div>
     <div><div class="fl" style="font-weight:600">Return due date for Q3 2026</div><input class="fi" style="max-width:160px" value="${CFG.returnDue}" readonly><div class="note">Read from the return calendar, not set here.</div></div></div>
     <div class="sec">Summary tables behind the dashboards</div>${table('aggT',[{k:'t',h:'Table'},{k:'g',h:'One row per'},{k:'n',h:'Rows today',n:1,f:x=>fmt(x.n)},{k:'s',h:'Fed by'}],[
      {t:'analytics_holding_quarter',g:'URN × substance × quarter',n:QF.length,s:'urn_substance, return_substance, return_line'},
      {t:'analytics_area_quarter',g:'zone × substance × quarter',n:13*8*24,s:'analytics_holding_quarter'},
      {t:'analytics_filing_quarter',g:'URN × form × quarter',n:P.length*8,s:'return_filing, non_filer_entry'},
      {t:'analytics_movement_quarter',g:'consignment note × quarter',n:NOTES.length*40,s:'consignment_note, its acknowledgement, return_line'}],{})}<button class="btn pri" data-cfgsave="1" style="margin-top:10px">Save</button></div>`;
  if(ST.cfgTab==='log')b=table('logT',[{k:'on',h:'When'},{k:'who',h:'Who'},{k:'what',h:'What changed'},{k:'b',h:'Before'},{k:'a',h:'After'}],[
    {on:'12 Nov 2026 16:40',who:'Super Admin',what:'Unmatched dispatches, Tier 1',b:'1.0%',a:'0.5%'},{on:'12 Nov 2026 16:38',who:'Super Admin',what:'2-Bromo-4-MPP tier',b:'Tier 2',a:'Tier 1'},{on:'30 Oct 2026 11:05',who:'Super Admin',what:'Rows per page',b:'50',a:'25'}],{});
  return pageHead('Configuration','Analytics settings for every office. Every change writes an audit_log row with the value before and after.')+
   `<section class="panel"><div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" class="${ST.cfgTab===t[0]?'on':''}" data-cfgtab="${t[0]}">${t[1]}</button>`).join('')}</div>${b}</section>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cfgtab],[data-cfgsave]');if(!b)return;
  if(b.dataset.cfgtab){ST.cfgTab=b.dataset.cfgtab;go()}
  else{document.querySelectorAll('[data-th]').forEach(i=>{const [k,t]=i.dataset.th.split(':');CFG.th[k].t[+t]=+i.value});
    document.querySelectorAll('[data-tier]').forEach(s=>CFG.tier[s.dataset.tier]=+s.value);
    document.querySelectorAll('[data-worse]').forEach(i=>CFG.worse[i.dataset.worse]=+i.value);
    document.querySelectorAll('[data-sc]').forEach(i=>{const [id,k]=i.dataset.sc.split(':'),r=CFG.score.find(x=>x.id===id);if(r)r[k]=k==='on'?i.checked:Math.max(0,+i.value||0)});document.querySelectorAll('[data-sccap]').forEach(i=>CFG.scoreCap=Math.max(1,+i.value||100));
     document.querySelectorAll('[data-warn]').forEach(i=>CFG.matterWarn=+i.value);rebuildMatters();toast('Saved. An audit_log row was written for each change. Dashboards use the new values from the next refresh.')}});

go();
</script>
</body>
</html>
